// autoexec.cfg - executado sempre na inicialização (depois do config.cfg)
// Não altera o config.cfg original do jogo
// EN: always executed at startup (after config.cfg). Does not touch the original config.cfg.

// Console: F11 abre/fecha (F1 e F12 já são usados pelo jogo)
// O console só funciona com "-dev" nas opções de inicialização da Steam.
// O console executa Lua: comandos são chamados com sys.concmd("comando").
// EN: F11 toggles the console. Requires "-dev" in Steam launch options.
// EN: the console runs Lua, call commands with sys.concmd("command").
bind f11 "toggleConsole" 255

// Nickname para partidas LAN (descomente e troque se quiser)
// set net_nickname "Rey"

// Carrega os atalhos de servidor com bots e farm de achievements
exec farm.cfg

// autoexec.cfg - always executed at startup, after config.cfg.
// Does not change the game's original config.cfg.

// F11 opens and closes the console (F1 and F12 are already used by the game).
// The console only works with "-dev" in the Steam launch options.
// The console runs Lua, so commands are called with sys.concmd("command").
bind f11 "toggleConsole" 255

// Nickname for LAN matches (uncomment and change it if you want)
// set net_nickname "Player"

// Loads the server and farming shortcuts
exec farm.cfg

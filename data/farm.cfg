// farm.cfg - atalhos para farmar os achievements online contra bots
// Carregado pelo autoexec.cfg. Use no console (F11) depois de "servidor".
//
// Fluxo:
//   1) servidor        -> sobe o servidor com 7 bots e abre o lobby
//   2) rota_01 ... rota_20 -> cada uma troca modo + mapa e inicia a corrida
//   3) progresso       -> mostra as estatísticas online no console
//
// A rota cobre os 10 modos (Love of Diversity) nas 10 primeiras corridas
// e os 20 mapas (I know the Route) até a rota_20.
// Se algum mapa não aceitar um modo, troque o modo daquela rota (ex.: modo_corrida; mapa_ke3).
//
// Como chamar no console (F11, executa Lua):
//   sys.concmd("servidor")   sys.concmd("rota_01")   sys.concmd("progresso")
//
// EN: shortcuts to farm the online achievements against bots.
// EN: in the console (Lua) use: sys.concmd("server"), sys.concmd("rota_01"), sys.concmd("progress"), sys.concmd("start")

//#region Servidor

alias servidor "exec host_bots.cfg"
alias parar "sv_stop"
alias progresso "exec progress.cfg"

// Inicia a partida do lobby sem exigir outro jogador "pronto" (os bots não contam nessa checagem)
alias iniciar "scriptRun 'UI.MpServerLobbyWnd:StartMpGame()'"

// Atalhos em inglês / English aliases
alias server "exec host_bots.cfg"
alias stop "sv_stop"
alias progress "exec progress.cfg"
alias start "scriptRun 'UI.MpServerLobbyWnd:StartMpGame()'"

//#endregion

//#region Modos (sempre com a menor pontuação/voltas aceita pela UI)

alias modo_corrida "set sv_gameMode 1; set sv_lapCount 2"
alias modo_pathfinder "set sv_gameMode 5; set sv_maxGates 15"
alias modo_gatehunt "set sv_gameMode 6; set sv_maxGates 15"
alias modo_markgate "set sv_gameMode 7; set sv_maxScoreMarkGate 150"
alias modo_jamboree "set sv_gameMode 8; set sv_maxScoreJamboree 5"
alias modo_capture "set sv_gameMode 9; set sv_maxScoreCaptureFlag 75"
alias modo_return "set sv_gameMode 10; set sv_maxScoreReturnFlag 50"
alias modo_chase "set sv_gameMode 11; set sv_maxScoreChaseFlag 50"
alias modo_greed "set sv_gameMode 12; set sv_maxScoreGreed 50"
alias modo_knockout "set sv_gameMode 14; set sv_knockoutTime 25"

//#endregion

//#region Mapas (define o próximo nível e carrega no servidor)

// Arizona (North America)
alias mapa_us1 "set sv_nextLevel us1; map us1"
alias mapa_us2 "set sv_nextLevel us2; map us2"
alias mapa_us3 "set sv_nextLevel us3; map us3"
alias mapa_us4 "set sv_nextLevel us4; map us4"
alias mapa_us5 "set sv_nextLevel us5; map us5"

// Nova Zelândia (Eurasia)
alias mapa_nz1 "set sv_nextLevel nz1; map nz1"
alias mapa_nz2 "set sv_nextLevel nz2; map nz2"
alias mapa_nz3 "set sv_nextLevel nz3; map nz3"
alias mapa_nz4 "set sv_nextLevel nz4; map nz4"
alias mapa_nz5 "set sv_nextLevel nz5; map nz5"

// Quênia (Africa)
alias mapa_ke1 "set sv_nextLevel ke1; map ke1"
alias mapa_ke2 "set sv_nextLevel ke2; map ke2"
alias mapa_ke3 "set sv_nextLevel ke3; map ke3"
alias mapa_ke4 "set sv_nextLevel ke4; map ke4"
alias mapa_ke5 "set sv_nextLevel ke5; map ke5"

// Antártida
alias mapa_aq1 "set sv_nextLevel aq1; map aq1"
alias mapa_aq2 "set sv_nextLevel aq2; map aq2"
alias mapa_aq3 "set sv_nextLevel aq3; map aq3"
alias mapa_aq4 "set sv_nextLevel aq4; map aq4"
alias mapa_aq5 "set sv_nextLevel aq5; map aq5"

//#endregion

//#region Rota de farm (modo + mapa)

// 1 a 10: um modo diferente por corrida (Love of Diversity)
alias rota_01 "modo_corrida; mapa_us1"
alias rota_02 "modo_knockout; mapa_us2"
alias rota_03 "modo_pathfinder; mapa_us3"
alias rota_04 "modo_gatehunt; mapa_us4"
alias rota_05 "modo_markgate; mapa_us5"
alias rota_06 "modo_jamboree; mapa_nz1"
alias rota_07 "modo_capture; mapa_nz2"
alias rota_08 "modo_return; mapa_nz3"
alias rota_09 "modo_chase; mapa_nz4"
alias rota_10 "modo_greed; mapa_nz5"

// 11 a 20: completa os 20 mapas (I know the Route)
alias rota_11 "modo_corrida; mapa_ke1"
alias rota_12 "modo_knockout; mapa_ke2"
alias rota_13 "modo_pathfinder; mapa_ke3"
alias rota_14 "modo_gatehunt; mapa_ke4"
alias rota_15 "modo_markgate; mapa_ke5"
alias rota_16 "modo_jamboree; mapa_aq1"
alias rota_17 "modo_capture; mapa_aq2"
alias rota_18 "modo_return; mapa_aq3"
alias rota_19 "modo_chase; mapa_aq4"
alias rota_20 "modo_greed; mapa_aq5"

// Depois da rota_20: mais 5 vitórias para Step to Fame (25)
// Use sempre o mesmo carro para Very good Car (10 vitórias)

//#endregion

// farm.cfg - shortcuts to farm the online achievements against bots.
// Loaded by autoexec.cfg.
//
// The in-game console runs Lua, so call these with sys.concmd("name"):
//   sys.concmd("server")    hosts the server with bots and opens the lobby
//   sys.concmd("route_01")  sets one mode plus one map and loads the race
//   sys.concmd("progress")  prints the online statistics
//   sys.concmd("start")     starts the lobby match without another ready player
//
// Routes 01-10 use one different mode each (Love of Diversity).
// Routes 01-20 together visit all 20 maps (I know the Route).
// If a map does not accept a mode, change that route (example: mode_race; map_ke3).

//#region Server

alias server "exec host_bots.cfg"
alias stop "sv_stop"
alias progress "exec progress.cfg"

// Starts the lobby match without requiring another ready player (bots do not count)
alias start "scriptRun 'UI.MpServerLobbyWnd:StartMpGame()'"

//#endregion

//#region Modes (always the smallest score or lap count the menu accepts)

alias mode_race "set sv_gameMode 1; set sv_lapCount 2"
alias mode_pathfinder "set sv_gameMode 5; set sv_maxGates 15"
alias mode_gatehunt "set sv_gameMode 6; set sv_maxGates 15"
alias mode_markgate "set sv_gameMode 7; set sv_maxScoreMarkGate 150"
alias mode_jamboree "set sv_gameMode 8; set sv_maxScoreJamboree 5"
alias mode_capture "set sv_gameMode 9; set sv_maxScoreCaptureFlag 75"
alias mode_return "set sv_gameMode 10; set sv_maxScoreReturnFlag 50"
alias mode_chase "set sv_gameMode 11; set sv_maxScoreChaseFlag 50"
alias mode_greed "set sv_gameMode 12; set sv_maxScoreGreed 50"
alias mode_knockout "set sv_gameMode 14; set sv_knockoutTime 25"

//#endregion

//#region Maps (sets the next level and loads it on the server)

// Arizona (North America)
alias map_us1 "set sv_nextLevel us1; map us1"
alias map_us2 "set sv_nextLevel us2; map us2"
alias map_us3 "set sv_nextLevel us3; map us3"
alias map_us4 "set sv_nextLevel us4; map us4"
alias map_us5 "set sv_nextLevel us5; map us5"

// New Zealand (Eurasia)
alias map_nz1 "set sv_nextLevel nz1; map nz1"
alias map_nz2 "set sv_nextLevel nz2; map nz2"
alias map_nz3 "set sv_nextLevel nz3; map nz3"
alias map_nz4 "set sv_nextLevel nz4; map nz4"
alias map_nz5 "set sv_nextLevel nz5; map nz5"

// Kenya (Africa)
alias map_ke1 "set sv_nextLevel ke1; map ke1"
alias map_ke2 "set sv_nextLevel ke2; map ke2"
alias map_ke3 "set sv_nextLevel ke3; map ke3"
alias map_ke4 "set sv_nextLevel ke4; map ke4"
alias map_ke5 "set sv_nextLevel ke5; map ke5"

// Antarctica
alias map_aq1 "set sv_nextLevel aq1; map aq1"
alias map_aq2 "set sv_nextLevel aq2; map aq2"
alias map_aq3 "set sv_nextLevel aq3; map aq3"
alias map_aq4 "set sv_nextLevel aq4; map aq4"
alias map_aq5 "set sv_nextLevel aq5; map aq5"

//#endregion

//#region Farming route (one mode plus one map per race)

// 1 to 10: a different mode on each race (Love of Diversity)
alias route_01 "mode_race; map_us1"
alias route_02 "mode_knockout; map_us2"
alias route_03 "mode_pathfinder; map_us3"
alias route_04 "mode_gatehunt; map_us4"
alias route_05 "mode_markgate; map_us5"
alias route_06 "mode_jamboree; map_nz1"
alias route_07 "mode_capture; map_nz2"
alias route_08 "mode_return; map_nz3"
alias route_09 "mode_chase; map_nz4"
alias route_10 "mode_greed; map_nz5"

// 11 to 20: finishes all 20 maps (I know the Route)
alias route_11 "mode_race; map_ke1"
alias route_12 "mode_knockout; map_ke2"
alias route_13 "mode_pathfinder; map_ke3"
alias route_14 "mode_gatehunt; map_ke4"
alias route_15 "mode_markgate; map_ke5"
alias route_16 "mode_jamboree; map_aq1"
alias route_17 "mode_capture; map_aq2"
alias route_18 "mode_return; map_aq3"
alias route_19 "mode_chase; map_aq4"
alias route_20 "mode_greed; map_aq5"

// After route_20: 5 more wins for Step to Fame (25).
// Use the same car the whole time for Very good Car (10 wins).

//#endregion

// host_bots.cfg - hosts a multiplayer server with 7 bots.
// From the Lua console (F11): sys.concmd("exec host_bots.cfg")  or  sys.concmd("server")
//
// This server uses sv_start (the game's own network, no Steam). It is the only one
// that accepts extra copies of the game on the same account. A server created from
// the Steam menu rejects them with "Authorization error".
//
// In the lobby:
//   - set "Bots" to "On free slots" (the lobby overwrites sv_numBots; "Forbidden" means 0 bots)
//   - to start alone: UI.MpServerLobbyWnd:StartMpGame()   or   sys.concmd("start")
//
// Alternative (Steam server, only you plus bots):
//   Menu > Multiplayer > Create server > Bots: On free slots > console: UI.MpServerLobbyWnd:StartMpGame()

// Closes any server that is already running
sv_stop

// Slots: 8 humans (slots 0-7) plus bots (slots 8 and up)
set sv_maxPlayers 8
set sv_numBots 7

// Bots use the same vehicle class as the player (7 = same_as_player)
set sv_vehicleClass 7

// Default mode: Offroad Race with the minimum number of laps
set sv_gameMode 1
set sv_lapCount 2

// First map of the farming route
set sv_nextLevel us1

// Starts the server and opens the lobby screen (mp_lobby)
sv_start mp_lobby

// host_bots.cfg - hospeda um servidor multiplayer com 7 bots
// Uso no console (F11): exec host_bots.cfg
//   -> no console Lua: sys.concmd("exec host_bots.cfg")
//
// Este servidor usa sv_start (rede própria, sem Steam). É o único que aceita
// cópias extras do jogo na mesma conta (o servidor Steam recusa com "Authorization error").
//
// No lobby:
//   - deixe "Bots" em "Allowed" (o lobby sobrescreve sv_numBots; "Forbidden" = 0 bots)
//   - para iniciar sozinho: UI.MpServerLobbyWnd:StartMpGame()  (ou sys.concmd("iniciar"))
//
// Caminho alternativo (servidor Steam, só você + bots):
//   Menu > Multiplayer > Criar servidor > Bots: Allowed > console: UI.MpServerLobbyWnd:StartMpGame()
//
// EN: hosts a non-Steam server (sv_start) with bots. Set "Bots" to "Allowed" in the lobby.
// EN: start alone with UI.MpServerLobbyWnd:StartMpGame() in the console.

// Fecha qualquer servidor anterior
sv_stop

// Vagas: 8 humanos (slots 0-7) + bots (slots 8+)
set sv_maxPlayers 8
set sv_numBots 7

// Bots usam a mesma classe de carro do jogador (7 = same_as_player)
set sv_vehicleClass 7

// Modo padrão: Offroad Race com o mínimo de voltas
set sv_gameMode 1
set sv_lapCount 2

// Primeiro mapa da rota
set sv_nextLevel us1

// Sobe o servidor e abre a tela de lobby (mp_lobby)
sv_start mp_lobby

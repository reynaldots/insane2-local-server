// progress.cfg (antigo progresso.cfg) - mostra no console (F11) as estatísticas dos achievements online
// Uso: progresso   (ou: exec progress.cfg)
//   -> no console Lua: sys.concmd("progresso") ou sys.concmd("progress")
// EN: prints the online achievement statistics in the console.

scriptRun 'sys.out("Vitorias online (Step to Fame, precisa 25): %s", tostring(Profile:StatGet("gameplay_win_multiplayer") or 0))'
scriptRun 'sys.out("Tempo online em segundos (For Ages, precisa 7200): %s", tostring(Profile:StatGet("game_time_multiplayer") or 0))'
scriptRun 'sys.out("Partidas online: %s", tostring(Profile:StatGet("gameplay_multiplayer") or 0))'

// Modos com vitória (Love of Diversity, precisa 1 em cada)
scriptRun 'for _, m in ipairs({"Offroad_Race","Knockout_Race","Pathfinder","Gate_Hunt","Mark_Gate","Jamboree","Capture_Flag","Return_Flag","Chase_Flag","Greed"}) do sys.out("  modo %s: %s", m, tostring(Profile:StatGet("gameplay_win_mp_" .. m) or 0)) end'

// Mapas com vitória (I know the Route, precisa 1 em cada)
scriptRun 'for _, r in ipairs({"us","nz","ke","aq"}) do for i = 1, 5 do local l = r .. i; sys.out("  mapa %s: %s", l, tostring(Profile:StatGet("gameplay_win_mp_level_" .. l) or 0)) end end'

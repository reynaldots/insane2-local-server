// progress.cfg - prints the online achievement statistics in the console.
// From the Lua console (F11): sys.concmd("progress")

scriptRun 'sys.out("Online wins (Step to Fame, needs 25): %s", tostring(Profile:StatGet("gameplay_win_multiplayer") or 0))'
scriptRun 'sys.out("Online time in seconds (For Ages, needs 7200): %s", tostring(Profile:StatGet("game_time_multiplayer") or 0))'
scriptRun 'sys.out("Online matches: %s", tostring(Profile:StatGet("gameplay_multiplayer") or 0))'

// Modes already won (Love of Diversity, needs 1 in each)
scriptRun 'for _, m in ipairs({"Offroad_Race","Knockout_Race","Pathfinder","Gate_Hunt","Mark_Gate","Jamboree","Capture_Flag","Return_Flag","Chase_Flag","Greed"}) do sys.out("  mode %s: %s", m, tostring(Profile:StatGet("gameplay_win_mp_" .. m) or 0)) end'

// Maps already won (I know the Route, needs 1 on each)
scriptRun 'for _, r in ipairs({"us","nz","ke","aq"}) do for i = 1, 5 do local l = r .. i; sys.out("  map %s: %s", l, tostring(Profile:StatGet("gameplay_win_mp_level_" .. l) or 0)) end end'

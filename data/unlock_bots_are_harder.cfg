// unlock_bots_are_harder.cfg - OPTIONAL last resort for "Bots are harder" (ACHIEV_HARDMODE).
// Use it only if you cannot get 8 connected humans (see tools/start_clients.ps1 -Clients 7).
// From the Lua console (F11): sys.concmd("exec unlock_bots_are_harder.cfg")
//
// NOT TESTED in-game. It should work: it calls Profile:UnlockAchievement, the same
// function the game calls when you earn an achievement, and that function calls
// Steam_UnlockAchievement and saves the profile.
//
// Why not "unlockAchievement ACHIEV_HARDMODE":
//   on PC that command only queues the achievement for Xbox Live (xlastId)
//   and never sends anything to Steam.

scriptRun 'Profile:UnlockAchievement("ACHIEV_HARDMODE", true)'

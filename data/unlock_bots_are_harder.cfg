// unlock_bots_are_harder.cfg - ÚLTIMO RECURSO para "Bots are harder" (ACHIEV_HARDMODE)
// Use só se não conseguir 8 humanos conectados (ver tools/start_server.ps1 -Clients 7).
// Uso no console (F11): exec unlock_bots_are_harder.cfg
//   -> no console Lua: sys.concmd("exec unlock_bots_are_harder.cfg")
// EN: OPTIONAL last resort. Unlocks "Bots are harder" exactly like the game does
// EN: when the condition is met. Prefer the 8-copies method described in the README.
//
// Por que não "unlockAchievement ACHIEV_HARDMODE":
//   no PC esse comando só coloca o achievement na fila do Xbox Live (xlastId)
//   e não envia nada para a Steam.
//
// Este comando faz exatamente o que o jogo faz quando a condição é cumprida:
//   marca no perfil, chama Steam_UnlockAchievement e salva o perfil.

scriptRun 'Profile:UnlockAchievement("ACHIEV_HARDMODE", true)'
